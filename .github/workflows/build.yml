name: Build and Release Firmware

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout firmware repository
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            gperf \
            device-tree-compiler \
            xz-utils

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install West
        run: |
          python -m pip install --upgrade pip
          python -m pip install west
          west --version

      - name: Initialize Zephyr 4.4.2 workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.4.2 .zephyr-workspace
          cd .zephyr-workspace
          west update --narrow -o=--depth=1
          python -m pip install $(west packages pip)
          west zephyr-export

      - name: Install Zephyr SDK (arm-zephyr-eabi)
        run: |
          cd .zephyr-workspace/zephyr
          west sdk install --gnu-toolchains arm-zephyr-eabi
          west sdk list

      - name: Build nrf52dk/nrf52832 firmware
        run: |
          cd .zephyr-workspace
          west build -p always -b nrf52dk/nrf52832 -d ../build ..
          sha256sum ../build/zephyr/zephyr.hex ../build/zephyr/zephyr.bin | tee ../build/zephyr/SHA256SUMS.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-ble-hil-firmware-nrf52dk
          path: |
            build/zephyr/zephyr.hex
            build/zephyr/zephyr.bin
            build/zephyr/SHA256SUMS.txt

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA256=$(awk '{print $1}' build/zephyr/SHA256SUMS.txt | head -n 1)
          gh release create "$TAG" \
            build/zephyr/zephyr.hex \
            build/zephyr/zephyr.bin \
            build/zephyr/SHA256SUMS.txt \
            --title "$TAG - Universal BLE HIL fixture firmware" \
            --notes "Built for \`nrf52dk/nrf52832\` with Zephyr 4.4.2.\n\n\`zephyr.hex\` SHA-256: \`${SHA256}\`"
